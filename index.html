<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard </title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
</head>

<body>

    
    <main class="scoreboard">

        
        <header class="header">

            <button
                class="btn-newGame"
                type="button"
                aria-label="Start a new basketball game">
                NEW GAME
            </button>

            
            <section
                class="timer-container"
                aria-label="Game timer and quarter">

                <h1 class="quarter">Quarter 1</h1>

                <div
                    class="time"
                    aria-live="polite">
                    00:00
                </div>

            </section>

            <button
                class="btn-startGame"
                type="button"
                aria-label="Start the basketball game timer">
                START GAME
            </button>

        </header>

        
        <section
            class="teams-container"
            aria-label="Basketball scoreboard">

            
            <article class="team home">

                <h2 class="team-name">HOME</h2>

                <div class="score-box">
                    <div
                        class="score"
                        id="home-score"
                        aria-live="polite">
                        0
                    </div>
                </div>

                <div
                    class="point-controls"
                    aria-label="Home team score controls">

                    <button
                        class="btn-point"
                        type="button"
                        onclick="addPoints('home', 1)"
                        aria-label="Add 1 point to home team">
                        +1
                    </button>

                    <button
                        class="btn-point"
                        type="button"
                        onclick="addPoints('home', 2)"
                        aria-label="Add 2 points to home team">
                        +2
                    </button>

                    <button
                        class="btn-point"
                        type="button"
                        onclick="addPoints('home', 3)"
                        aria-label="Add 3 points to home team">
                        +3
                    </button>

                </div>
            </article>

            
            <article class="team guest">

                <h2 class="team-name">GUEST</h2>

                <div class="score-box">
                    <div
                        class="score"
                        id="guest-score"
                        aria-live="polite">
                        0
                    </div>
                </div>

                <div
                    class="point-controls"
                    aria-label="Guest team score controls">

                    <button
                        class="btn-point"
                        type="button"
                        onclick="addPoints('guest', 1)"
                        aria-label="Add 1 point to guest team">
                        +1
                    </button>

                    <button
                        class="btn-point"
                        type="button"
                        onclick="addPoints('guest', 2)"
                        aria-label="Add 2 points to guest team">
                        +2
                    </button>

                    <button
                        class="btn-point"
                        type="button"
                        onclick="addPoints('guest', 3)"
                        aria-label="Add 3 points to guest team">
                        +3
                    </button>

                </div>
            </article>

        </section>

    </main>

    <script src="index.js"></script>

</body>
</html>
